name: Deploy User Lambda

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install all dependencies
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript validation
      - name: TypeScript type check
        run: npm run typecheck

      # 5. Compile TypeScript
      - name: Build TypeScript
        run: npm run build

      # 6. Prepare Lambda deployment package
      - name: Prepare Lambda package
        run: |
          mkdir lambda-package

          cp -R dist/* lambda-package/
          cp package.json lambda-package/
          cp package-lock.json lambda-package/

          cd lambda-package

          npm ci --omit=dev

          zip -r ../lambda.zip .

      # 7. Authenticate GitHub → AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::870766663926:role/GitHubActionsUserLambdaDeployRole
          aws-region: ap-south-1

      # 8. Deploy code to Lambda
      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name user-lambda \
            --zip-file fileb://lambda.zip