name: Deploy User Lambda

on:
  push:
    branches:
      - main

# Required for GitHub OIDC authentication with AWS
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install all dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Validate TypeScript
      - name: TypeScript type check
        run: npm run typecheck

      # 5. Compile TypeScript → dist/
      - name: Build TypeScript
        run: npm run build

      # 6. Create Lambda deployment package
      - name: Prepare Lambda package
        run: |
          rm -rf lambda-package
          rm -f lambda.zip

          mkdir -p lambda-package

          # Copy compiled JavaScript
          cp -R dist/* lambda-package/

          # Copy package files
          cp package.json lambda-package/
          cp package-lock.json lambda-package/

          # Install only production dependencies
          cd lambda-package
          npm ci --omit=dev

          # Create deployment ZIP
          zip -rq ../lambda.zip .

          cd ..

          echo "Lambda package created:"
          ls -lh lambda.zip

      # 7. Authenticate GitHub → AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::870766663926:role/CustomDeployUserLambdaPolicy
          aws-region: ap-south-1
          role-session-name: github-user-lambda-deploy

      # 8. Verify AWS authentication
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 9. Deploy new code to Lambda
      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name user-lambda \
            --zip-file fileb://lambda.zip \
            --region ap-south-1

      # 10. Wait until Lambda finishes updating
      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name user-lambda \
            --region ap-south-1

      # 11. Verify deployment status
      - name: Verify Lambda deployment
        run: |
          aws lambda get-function-configuration \
            --function-name user-lambda \
            --region ap-south-1 \
            --query '{
              FunctionName:FunctionName,
              Runtime:Runtime,
              LastModified:LastModified,
              State:State,
              LastUpdateStatus:LastUpdateStatus
            }'